version: '3.9'

services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: ./.env
    command:
      - sh
      - -c
      - |
        if [ ! -f /app/data/db.json ]; then
          cp /app/server/db.json /app/data/db.json
        fi
        npx json-server --watch /app/data/db.json --host 0.0.0.0 --port 3001
    environment:
      NODE_ENV: production
    volumes:
      - db-data:/app/data
    ports:
      - "3001:3001"

  uploads:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: ./.env
    command: ["npm", "run", "upload"]
    environment:
      NODE_ENV: production
      UPLOAD_PORT: 3002
    volumes:
      - ./public/uploads:/app/public/uploads
    ports:
      - "3002:3002"

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_UPLOAD_URL: ${VITE_UPLOAD_URL}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT}
        VITE_UPLOAD_TIMEOUT: ${VITE_UPLOAD_TIMEOUT}
    depends_on:
      - api
      - uploads
    ports:
      - "3000:80"

volumes:
  db-data:
